[package]
name = "khcore"
version = "0.1.0"
edition = "2021"
description = "Portable Khmer autocomplete / Khmerlish engine (no platform code, no network)"
license = "MIT OR Apache-2.0"

[dependencies]
fst = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"

[[bin]]
name = "khbuild"
path = "src/bin/khbuild.rs"
