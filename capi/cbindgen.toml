language = "C"
include_guard = "KHCORE_H"
header = "/* khcore C API. Generated by cbindgen from capi/src/lib.rs: do not edit; run capi/gen-header.sh. */"
cpp_compat = true
documentation = true
documentation_style = "c99"
style = "both"
usize_is_size_t = true
no_includes = false
sys_includes = ["stddef.h", "stdint.h"]

[export]
include = []

[enum]
prefix_with_name = false
