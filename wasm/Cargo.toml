[package]
name = "khcore-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly wrapper over khcore, so the web demo runs the same engine as the native shells"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
khcore = { path = "../core" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
