[package]
name = "khtsf"
version = "0.1.0"
edition = "2021"
description = "khtsf.dll: Windows Text Services Framework text service for Khmer autocomplete. A thin client of khengine.exe."
license = "MIT OR Apache-2.0"

[lib]
name = "khtsf"
crate-type = ["cdylib", "rlib"]

# No khcore here on purpose: the DLL is loaded into every app and must stay small. It links the key layout table
# (tiny, no dependencies) so Khmer typing still works when the engine process is not running.
[dependencies]
khlayout = { path = "../../layout" }
khipc = { path = "../ipc" }

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows-numerics = "0.3"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
]
